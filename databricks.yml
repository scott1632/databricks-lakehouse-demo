bundle:
  name: lakehouse-demo

include:
  - resources/*.yml

artifacts:
  lakehouse_wheel:
    type: whl
    build: python -m pip install --upgrade build && python -m build
    path: .

variables:
  catalog:
    description: Unity Catalog catalog to write demo tables into
    default: main
  schema:
    description: Schema (database) within the catalog for this demo's tables
    default: lakehouse_demo

targets:
  dev:
    mode: development
    default: true

  prod:
    mode: production
    variables:
      schema: lakehouse_demo_prod
