resources:
  jobs:
    medallion_pipeline:
      name: "[${bundle.target}] Medallion Pipeline (bronze -> silver -> gold)"
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: "UTC"
        pause_status: PAUSED # unpause once you're ready for it to run on schedule

      # Serverless compute: no job_clusters/new_cluster block. Each task runs
      # on Databricks-managed serverless compute, and the wheel dependency
      # is declared once here (rather than as a per-task cluster library,
      # which requires a classic cluster that doesn't exist on serverless).
      environments:
        - environment_key: lakehouse_env
          spec:
            client: "2"
            dependencies:
              - ../dist/*.whl

      tasks:
        - task_key: bronze_ingest
          environment_key: lakehouse_env
          notebook_task:
            notebook_path: ../notebooks/01_bronze_ingest.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              event_count: "2000"

        - task_key: silver_clean
          environment_key: lakehouse_env
          depends_on:
            - task_key: bronze_ingest
          notebook_task:
            notebook_path: ../notebooks/02_silver_clean.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}

        - task_key: gold_aggregate
          environment_key: lakehouse_env
          depends_on:
            - task_key: silver_clean
          notebook_task:
            notebook_path: ../notebooks/03_gold_aggregate.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
